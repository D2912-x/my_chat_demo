name: proactive-notify

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proactive-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run notifier
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_PWD: ${{ secrets.NOTIFY_PWD }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: node notify/send.js

      - name: Commit outbox
        run: |
          if [ -f outbox.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outbox.enc
            if ! git diff --cached --quiet; then
              git commit -m "chore: update outbox"
              git push
            fi
          fi
